name: WF - Quarkus CI Pipeline

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to the service root relative to repo root (e.g. software/core/oqm-core-api)'
        required: true
        type: string
      java-version:
        description: 'Java version to build with'
        default: '21'
        type: string
      run-int-tests:
        description: 'Whether to run integration tests'
        default: true
        type: boolean
      container-based-int-tests:
        description: 'Whether integration tests require a container image build'
        default: false
        type: boolean
      jacoco-min-coverage-overall:
        description: 'Minimum overall JaCoCo line coverage percentage (0-100)'
        default: 60
        type: number
      jacoco-min-coverage-changed:
        description: 'Minimum JaCoCo line coverage percentage for changed files (0-100)'
        default: 80
        type: number

jobs:

  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: java-kotlin
          build-mode: none # This mode only analyzes Java. Set this to 'autobuild' or 'manual' to analyze Kotlin too.
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      working-directory: ${{ inputs.path }}
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            api.adoptium.net:443
            plugins.gradle.org:443
            services.gradle.org:443
            repo1.maven.org:443
            jcenter.bintray.com:443

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner
        uses: Epic-Breakfast-Productions/ebp-ci/.github/actions/setup-quarkus-runner@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-read-only: false

      - name: Build (skip tests)
        working-directory: ${{ inputs.path }}
        # Also exclude quarkusIntTest: build.gradle has `check { finalizedBy quarkusIntTest }`
        # which means -x test alone does not prevent integration tests from running via check.
        run: ./gradlew build -x test -x quarkusIntTest


  unit-test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            api.adoptium.net:443
            plugins.gradle.org:443
            services.gradle.org:443
            repo1.maven.org:443
            jcenter.bintray.com:443

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner
        uses: Epic-Breakfast-Productions/ebp-ci/.github/actions/setup-quarkus-runner@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-read-only: true

      - name: Run unit tests
        working-directory: ${{ inputs.path }}
        # quarkus-jacoco generates its report automatically during the test run;
        # jacocoTestReport is explicitly disabled in build.gradle so we don't call it.
        run: ./gradlew test

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: ${{ inputs.path }}/build/test-results/test/*.xml
          reporter: java-junit

      - name: Check JaCoCo coverage
        uses: madrapps/jacoco-report@v1.7.1
        if: always()
        with:
          # quarkus-jacoco writes its XML report here (not the standard Gradle jacoco path)
          paths: ${{ inputs.path }}/build/jacoco-report/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code Coverage
          min-coverage-overall: ${{ inputs.jacoco-min-coverage-overall }}
          min-coverage-changed-files: ${{ inputs.jacoco-min-coverage-changed }}

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ inputs.path }}/build/jacoco-report
          retention-days: 7

      - name: Archive unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: ${{ inputs.path }}/build/reports/tests/test
          retention-days: 7


  int-test:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.run-int-tests }}
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            api.adoptium.net:443
            plugins.gradle.org:443
            services.gradle.org:443
            repo1.maven.org:443
            jcenter.bintray.com:443

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner
        uses: Epic-Breakfast-Productions/ebp-ci/.github/actions/setup-quarkus-runner@main
        with:
          java-version: ${{ inputs.java-version }}
          cache-read-only: true

      - name: Run integration tests
        working-directory: ${{ inputs.path }}
        run: ./gradlew quarkusIntTest -x test -Pquarkus.container-image.build=${{ inputs.container-based-int-tests }}

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: ${{ inputs.path }}/build/test-results/quarkusIntTest/*.xml
          reporter: java-junit

      - name: Archive integration test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int-test-report
          path: ${{ inputs.path }}/build/reports/tests/quarkusIntTest
          retention-days: 7
